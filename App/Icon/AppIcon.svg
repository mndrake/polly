<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Polly app icon. macOS grid: 824×824 body centred on a 1024 canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20C4B0"/>
      <stop offset="0.55" stop-color="#2E7FD0"/>
      <stop offset="1" stop-color="#4B3BB5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="292" y1="0" x2="768" y2="0">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FF9F43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1440" flood-opacity="0.35"/>
    </filter>
    <filter id="bodyShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Body -->
  <g filter="url(#bodyShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <!-- Speech bubble -->
  <g filter="url(#shadow)">
    <path d="M300 268 H724 A104 104 0 0 1 828 372 V600 A104 104 0 0 1 724 704 H470
             L352 800 Q336 812 338 792 L350 704 H300 A104 104 0 0 1 196 600 V372 A104 104 0 0 1 300 268 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- Waveform -->
  <g fill="url(#wave)">
    <rect x="292" y="446" width="44" height="80"  rx="22"/>
    <rect x="364" y="400" width="44" height="172" rx="22"/>
    <rect x="436" y="352" width="44" height="268" rx="22"/>
    <rect x="508" y="330" width="44" height="312" rx="22"/>
    <rect x="580" y="376" width="44" height="220" rx="22"/>
    <rect x="652" y="420" width="44" height="132" rx="22"/>
    <rect x="724" y="456" width="44" height="60"  rx="22"/>
  </g>

  <!-- AI sparkle -->
  <path d="M808 132 C815 184 832 201 884 208 C832 215 815 232 808 284 C801 232 784 215 732 208 C784 201 801 184 808 132 Z"
        fill="url(#spark)" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
</svg>
