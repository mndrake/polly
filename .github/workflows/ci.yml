name: CI

on:
  push:
  pull_request:

jobs:
  core-linux:
    name: PollyCore (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  app-macos:
    name: Polly.app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - run: swift --version
      - run: swift test
      - run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Polly.app
          path: build/Polly.app
