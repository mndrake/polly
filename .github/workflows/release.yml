name: Release

# Builds Polly.app and publishes it as a GitHub Release, either when a version
# tag is pushed (`git tag v0.2.0 && git push origin v0.2.0`) or when run
# manually from the Actions tab with a version (the tag is then created).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, e.g. v0.2.0"
        required: true

env:
  TAG: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: Build & publish Polly.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - run: swift --version

      - run: swift test

      - name: Stamp version from tag
        run: |
          VERSION="${TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" App/Info.plist

      - name: Build Polly.app (universal)
        run: scripts/build-app.sh
        env:
          UNIVERSAL: "1"
          ZIP: "1"

      - name: Rename archive
        run: mv build/Polly.zip "build/Polly-${TAG}-macOS.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "build/Polly-${TAG}-macOS.zip" \
            --target "$GITHUB_SHA" \
            --title "Polly ${TAG}" \
            --notes "$(cat <<'EOF'
          Universal (Apple Silicon + Intel) build of Polly for macOS 14 or later. macOS 26 gives the best transcription.

          **Install**
          1. Download `Polly-*-macOS.zip`, unzip it and move `Polly.app` to Applications.
          2. This build is ad-hoc signed (not notarized), so macOS blocks it the first time: right-click **Polly.app → Open**, or run `xattr -dr com.apple.quarantine /Applications/Polly.app`.
          3. For summaries, install Claude Code and run `claude` once in Terminal to sign in with your Claude plan (or add an Anthropic API key in Settings). Allow Microphone, Screen & System Audio Recording and Calendar when asked (restart Polly after granting screen recording).
          4. Telling speakers apart needs macOS 15+; the first meeting downloads the on-device voice models.
          EOF
          )"
